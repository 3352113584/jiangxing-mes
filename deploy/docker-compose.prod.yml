# ============================================================
# 匠星智造 MES — 生产环境 Docker Compose（可复现部署）
# ============================================================
# 部署拓扑：
#   Internet
#     ↓  HTTPS/443  (HTTP/80 → 443 跳转)
#   Nginx (gateway)
#     ↓  /api/  →  backend:8000
#     ↓  /      →  静态前端 (挂载 frontend-dist)
#   backend  ──→  PostgreSQL (postgres:5432，仅内部网络)
#
# 关键隔离：
#   - PostgreSQL 不映射任何宿主机/公网端口，仅存在于内部网络 mes_net。
#   - backend 仅在内部网络监听，不经网关不直接暴露。
#   - 公网仅开放 443（HTTPS）与 80（HTTP→HTTPS 跳转）。
#
# 敏感信息：
#   - 真实密码/密钥通过 deploy/.env（不入库）注入。
#   - TLS 证书通过宿主机 ./certs 挂载（不入库）。
#   - 前端静态资源通过 ./frontend-dist 挂载（构建产物，不入库）。
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jiangxing_mes}
      POSTGRES_USER: ${POSTGRES_USER:-mes_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 deploy/.env 中设置}"
      # 应用/迁移角色口令（账号分离；由 deploy/.env 注入，不硬编码）
      # POSTGRES_USER 是 Postgres 镜像管理员，仅用于初始化与运维，应用/迁移均不得复用。
      MES_APP_PASSWORD: "${MES_APP_PASSWORD:?MES_APP_PASSWORD 必须在 deploy/.env 中设置}"
      MES_MIGRATION_PASSWORD: "${MES_MIGRATION_PASSWORD:?MES_MIGRATION_PASSWORD 必须在 deploy/.env 中设置}"
      # 时区必须 Asia/Shanghai（T-17 使用 CURRENT_DATE，依赖实例时区）
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --timezone=Asia/Shanghai"
    volumes:
      - mes_postgres_data:/var/lib/postgresql/data
      # 首次初始化（数据卷为空）时创建 mes_migration / mes_app 角色，落实账号分离
      # 详见 deploy/docker/initdb/01_create_roles.sh
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - mes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mes_user} -d ${POSTGRES_DB:-jiangxing_mes}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 注意：postgres 不设置 ports，5432 仅容器网络可见，绝不暴露公网。

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mes-backend
    restart: unless-stopped
    environment:
      # 应用运行态：最小权限角色 mes_app（口令见 MES_APP_PASSWORD）
      # 严禁指向 POSTGRES_USER（镜像管理员），应用不得以管理员账号连接数据库。
      MES_DATABASE_URL: "postgresql+psycopg://mes_app:${MES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-jiangxing_mes}"
      # 迁移/DDL：独立迁移角色 mes_migration（非超级用户，仅承担迁移）
      # 严禁指向 POSTGRES_USER（镜像管理员），迁移不得与管理员账号混用。
      MES_MIGRATION_DATABASE_URL: "postgresql+psycopg://mes_migration:${MES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB:-jiangxing_mes}"
      MES_SECRET: "${MES_SECRET:?MES_SECRET 必须在 deploy/.env 中设置}"
      MES_TOKEN_TTL: "${MES_TOKEN_TTL:-43200}"
      MES_DEBUG: "false"
      MES_CORS_ORIGINS: "${MES_CORS_ORIGINS}"
      TZ: Asia/Shanghai
      MES_DB_POOL_SIZE: "${MES_DB_POOL_SIZE:-10}"
      MES_DB_MAX_OVERFLOW: "${MES_DB_MAX_OVERFLOW:-20}"
      MES_DB_POOL_RECYCLE: "${MES_DB_POOL_RECYCLE:-1800}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mes_net
    # 后端仅在内部网络监听，不映射公网端口；由网关转发。

  gateway:
    image: nginx:1.27-alpine
    container_name: mes-gateway
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - mes_net

  # 可选前端构建服务：当 frontend/ 已纳入真实源码时，
  # 执行 `docker compose -f deploy/docker-compose.prod.yml --profile frontend up frontend`
  # 构建并将静态资源写入 ./frontend-dist（供网关挂载）。
  frontend:
    profiles: ["frontend"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: mes-frontend-build
    volumes:
      - ./frontend-dist:/dist:rw
    networks:
      - mes_net

networks:
  mes_net:
    name: mes_net
    driver: bridge

volumes:
  mes_postgres_data:
    name: mes_postgres_data
    driver: local
