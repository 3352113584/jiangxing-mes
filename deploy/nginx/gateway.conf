# 匠星智造 MES 网关（HTTPS 反向代理）
#
# 证书：/etc/nginx/certs/fullchain.pem 与 privkey.pem（宿主机挂载，不入库）
# 静态前端：/usr/share/nginx/html（挂载 frontend-dist）
# API：反向代理到内部 backend:8000（保留 /api 前缀）
#
# 日志：不记录 Authorization 等敏感头（B-8 安全要求）。
#
# 注意：log_format 名称不得复用 nginx 主配置（/etc/nginx/nginx.conf）中已存在的
# "main"，否则 nginx 启动报 `duplicate "log_format" name "main"`（[emerg]）而无法启动。
# 因此此处使用自定义名称 mes_log，并由 access_log 显式引用。
log_format mes_log '$remote_addr - $request_time - "$request" '
                   'status=$status size=$body_bytes_sent';

# HTTP → HTTPS 跳转（80 仅用于跳转，不承载业务）
server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传体积上限（构件图纸/照片等，预留）
    client_max_body_size 50m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/access.log mes_log;
    error_log  /var/log/nginx/error.log warn;

    # 静态前端（SPA）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：保留原始 /api 路径转发到内部 backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
